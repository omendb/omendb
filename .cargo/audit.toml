# cargo-audit configuration
# Mirrors deny.toml ignores for rustsec/audit-check GitHub Action

[advisories]
ignore = [
    # Unmaintained crates from sled (optional benchmark dependency only)
    "RUSTSEC-2024-0384",  # instant
    "RUSTSEC-2025-0057",  # fxhash
    # Transitive from object_store - unmaintained but not a vulnerability
    "RUSTSEC-2025-0134",  # rustls-pemfile
]
