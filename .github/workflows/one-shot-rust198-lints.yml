name: One-shot Rust 1.98 lint cleanup

on:
  push:
    branches:
      - fix/rust-1.98-clippy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Apply exact lint cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('crates/seerdb/src/db/publication_recovery_tests.rs'),
              Path('crates/seerdb/src/db/tests.rs'),
          ]
          old = '(4 + 1 + CommitRecord::SERIALIZED_SIZE + 4) as usize'
          new = '4 + 1 + CommitRecord::SERIALIZED_SIZE + 4'
          count = 0
          for path in paths:
              text = path.read_text()
              matches = text.count(old)
              count += matches
              path.write_text(text.replace(old, new))
          if count != 6:
              raise SystemExit(f'expected exactly 6 replacements, found {count}')
          PY
      - name: Commit cleanup and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-rust198-lints.yml
          git add crates/seerdb/src/db/publication_recovery_tests.rs crates/seerdb/src/db/tests.rs
          git commit -m 'fix(seerdb): remove remaining redundant WAL size casts'
          git push origin HEAD:${GITHUB_REF_NAME}
