name: Security Audit

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
  # Also run on Cargo.lock changes
  push:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"

permissions:
  issues: write # For creating issues on vulnerabilities
  checks: write # For rustsec/audit-check to create check runs

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Creates an issue if vulnerabilities found
          create-issue: true

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Check licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      - name: Check bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

      - name: Check sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check sources

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -E "^rust-version" Cargo.toml | sed 's/rust-version = "\(.*\)"/\1/' || echo "1.70")
          echo "msrv=$MSRV" >> $GITHUB_OUTPUT
          echo "📋 MSRV: $MSRV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
        if: steps.msrv.outputs.msrv != ''

      - name: Check MSRV builds
        run: cargo check --lib --no-default-features
        if: steps.msrv.outputs.msrv != ''
