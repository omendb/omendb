name: One-shot FK schema activation

on:
  push:
    branches:
      - test/concurrent-fk-integrity

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt, clippy
      - name: Apply catalog publication fence and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/seer_direct.rs')
          text = path.read_text()
          impl_start = text.index('impl DirectTransaction {')
          begin_start = text.index(
              '    pub(crate) fn begin(store: &DirectSeerStore) -> Result<Self> {',
              impl_start,
          )
          next_marker = '\n    /// Validate that current snapshot-plus-staged rows already satisfy one'
          begin_end = text.index(next_marker, begin_start)
          replacement = '''    pub(crate) fn begin(store: &DirectSeerStore) -> Result<Self> {
              let mut transaction = store.database.begin().map_err(map_seer_error)?;

              // The relational mappings below are a snapshot of OmenDB's catalog.
              // Fence any writing transaction that outlives a schema publication:
              // every schema change rewrites this marker, and SeerDB validates the
              // registered exact-key range against commits after our snapshot.
              let mut catalog_end = DIRECT_CATALOG_MARKER.to_vec();
              catalog_end.push(0);
              drop(
                  transaction
                      .cursor(
                          store.catalog_tree,
                          DIRECT_CATALOG_MARKER,
                          Some(&catalog_end),
                      )
                      .map_err(map_seer_error)?,
              );

              Ok(Self {
                  catalog: store.catalog.clone(),
                  table_trees: store.table_trees.clone(),
                  index_trees: store.index_trees.clone(),
                  transaction,
              })
          }
          '''
          text = text[:begin_start] + replacement + text[begin_end:]
          path.write_text(text)
          PY

          cat >> tests/project_referential_actions.rs <<'RS'

          #[test]
          fn transaction_started_before_fk_activation_cannot_publish_dangling_reference() {
              let (_directory, mut database) = setup();
              seed(&mut database);

              let mut stale = database.begin().expect("stale transaction");
              stale
                  .delete(&database, PARENTS, key_of(PARENTS, 1))
                  .expect("stage parent delete");

              database
                  .create_foreign_key(fk(
                      1,
                      CHILDREN,
                      PARENTS,
                      omendb::ReferentialAction::Restrict,
                  ))
                  .expect("activate restrict fk");

              assert!(matches!(
                  stale.commit(),
                  Err(omendb::DbError::SerializationConflict { .. })
              ));
              assert!(
                  database
                      .get(PARENTS, key_of(PARENTS, 1))
                      .expect("parent read")
                      .is_some()
              );
              assert!(
                  database
                      .get(CHILDREN, key_of(CHILDREN, 11))
                      .expect("child read")
                      .is_some()
              );
          }
          RS
          cargo fmt --all
      - name: Verify stale-catalog fence repeatedly
        run: |
          for attempt in 1 2 3 4 5; do
            echo "schema fence qualification run ${attempt}"
            cargo test --locked --test project_referential_actions transaction_started_before_fk_activation_cannot_publish_dangling_reference -- --nocapture
          done
      - name: Verify row-level FK race remains closed
        run: cargo test --locked --test project_referential_actions overlapping_parent_delete_and_child_insert_cannot_both_commit -- --nocapture
      - name: Verify relational transaction suites
        run: |
          cargo test --locked --test project_referential_actions
          cargo test --locked --test project_transactions
      - name: Verify strict Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-fk-schema-activation.yml
          git add src/seer_direct.rs tests/project_referential_actions.rs
          git commit -m 'fix: fence transactions across schema changes'
          git push origin HEAD:${GITHUB_REF_NAME}
