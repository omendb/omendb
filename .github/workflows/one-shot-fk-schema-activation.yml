name: One-shot FK schema activation

on:
  push:
    branches:
      - test/concurrent-fk-integrity

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Add stale-catalog FK activation diagnostic
        run: |
          cat >> tests/project_referential_actions.rs <<'RS'

          #[test]
          fn transaction_started_before_fk_activation_cannot_publish_dangling_reference() {
              let (_directory, mut database) = setup();
              seed(&mut database);

              // This transaction captures a catalog with no FK and stages the
              // parent deletion before the constraint is activated.
              let mut stale = database.begin().expect("stale transaction");
              stale
                  .delete(&database, PARENTS, key_of(PARENTS, 1))
                  .expect("stage parent delete");

              // The committed state is currently valid, so FK activation succeeds.
              database
                  .create_foreign_key(fk(
                      1,
                      CHILDREN,
                      PARENTS,
                      omendb::ReferentialAction::Restrict,
                  ))
                  .expect("activate restrict fk");

              let stale_result = stale.commit();
              let parent_present = database
                  .get(PARENTS, key_of(PARENTS, 1))
                  .expect("parent read")
                  .is_some();
              let child_present = database
                  .get(CHILDREN, key_of(CHILDREN, 11))
                  .expect("child read")
                  .is_some();
              eprintln!(
                  "stale FK activation: result={stale_result:?}, parent_present={parent_present}, child_present={child_present}"
              );

              assert!(
                  stale_result.is_err(),
                  "transaction with a stale pre-FK catalog unexpectedly committed"
              );
              assert!(parent_present, "stale parent delete became durable");
              assert!(child_present, "existing child disappeared");
          }
          RS
          cargo fmt --all
      - name: Run stale-catalog FK activation diagnostic
        run: cargo test --locked --test project_referential_actions transaction_started_before_fk_activation_cannot_publish_dangling_reference -- --nocapture
