name: One-shot concurrent unique integrity

on:
  push:
    branches:
      - test/concurrent-unique-integrity

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt, clippy
      - name: Add overlapping unique-value regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/seer_direct.rs')
          text = path.read_text()
          addition = r'''

              #[test]
              fn overlapping_unique_value_inserts_cannot_both_commit() {
                  let (_directory, mut store) = store();
                  store
                      .create_table(table(), Some(vec![ColumnId(1)]))
                      .expect("create table");
                  store
                      .create_index(IndexDefinition {
                          id: IndexId(1),
                          table: TableId(1),
                          columns: vec![ColumnId(2)],
                          unique: true,
                      })
                      .expect("create unique index");

                  let mut first = store.begin_transaction().expect("first begin");
                  let mut second = store.begin_transaction().expect("second begin");
                  first
                      .insert(TableId(1), row(1, "same@example.com"))
                      .expect("first stage");
                  second
                      .insert(TableId(1), row(2, "same@example.com"))
                      .expect("second stage");

                  first.commit().expect("first commits");
                  assert!(matches!(
                      second.commit(),
                      Err(DbError::SerializationConflict { .. })
                  ));

                  let rows = store.scan(TableId(1)).expect("rows after conflict");
                  assert_eq!(rows.len(), 1);
                  let indexed = store
                      .index_get(
                          TableId(1),
                          IndexId(1),
                          &[Value::Text("same@example.com".to_owned())],
                      )
                      .expect("unique index after conflict");
                  assert_eq!(indexed.len(), 1);
                  assert_eq!(indexed[0].values, row(1, "same@example.com").values);
              }
          '''
          # The file ends with the test module's closing brace.
          end = text.rfind('\n}')
          if end < 0:
              raise SystemExit('test module closing brace not found')
          path.write_text(text[:end] + addition + text[end:])
          PY
          cargo fmt --all
      - name: Verify unique race repeatedly
        run: |
          for attempt in 1 2 3 4 5; do
            echo "unique race qualification run ${attempt}"
            cargo test --locked -p omendb --lib overlapping_unique_value_inserts_cannot_both_commit -- --nocapture
          done
      - name: Verify direct-store library tests
        run: cargo test --locked -p omendb --lib seer_direct::tests
      - name: Verify strict Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Commit regression and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-concurrent-unique.yml
          git add src/seer_direct.rs
          git commit -m 'test: cover concurrent unique-value conflicts'
          git push origin HEAD:${GITHUB_REF_NAME}
