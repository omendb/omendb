name: Extended validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked
      - name: Check dependency policy
        run: cargo deny check all

  docs:
    name: Documentation (warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  release-test:
    name: Release all-target tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Run release tests
        run: cargo test --release --all-features --all-targets

  real-enospc:
    name: Real filesystem ENOSPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Mount dedicated size-limited filesystem
        run: |
          sudo mkdir -p /mnt/seerdb-enospc
          sudo mount -t tmpfs -o size=64m,nr_inodes=10000 tmpfs /mnt/seerdb-enospc
          echo "SEERDB_ENOSPC_ROOT=/mnt/seerdb-enospc" >> "$GITHUB_ENV"
      - name: Exercise real capacity refusal and retry
        run: cargo test --all-features --test real_enospc -- --ignored
      - name: Unmount dedicated filesystem
        if: always()
        run: sudo umount /mnt/seerdb-enospc
