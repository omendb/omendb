name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks first (no build deps needed)
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Lint checks
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (lib)
        run: |
          cargo clippy --workspace --no-default-features --lib -- \
            -D clippy::correctness \
            -W clippy::suspicious \
            -W clippy::complexity \
            -W clippy::pedantic \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A dead_code \
            -A unused_imports

      - name: Clippy (tests)
        run: |
          cargo clippy --workspace --no-default-features --tests -- \
            -D clippy::correctness \
            -W clippy::suspicious \
            -A dead_code \
            -A unused_imports

  # Unit tests (fast, every commit)
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: clippy
    strategy:
      matrix:
        include:
          - name: stable
            toolchain: stable
            features: --no-default-features
          - name: nightly+simd
            toolchain: nightly
            features: --all-features
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib ${{ matrix.features }}
        timeout-minutes: 10

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --workspace --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
