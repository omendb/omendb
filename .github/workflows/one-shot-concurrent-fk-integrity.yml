name: One-shot concurrent FK integrity

on:
  push:
    branches:
      - test/concurrent-fk-integrity

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Add overlapping FK race diagnostic
        run: |
          cat >> tests/project_referential_actions.rs <<'RS'

          #[test]
          fn overlapping_parent_delete_and_child_insert_cannot_both_commit() {
              fn database_with_parent_and_restrict_fk() -> (tempfile::TempDir, RelationalDatabase) {
                  let (directory, mut database) = setup();
                  database
                      .insert(PARENTS, row(PARENTS, 1, Some(0)))
                      .expect("parent");
                  database
                      .create_foreign_key(fk(
                          1,
                          CHILDREN,
                          PARENTS,
                          omendb::ReferentialAction::Restrict,
                      ))
                      .expect("restrict fk");
                  (directory, database)
              }

              // Child publishes first. The overlapping parent delete must fail,
              // and the durable state must retain both the parent and child.
              {
                  let (_directory, database) = database_with_parent_and_restrict_fk();
                  let mut child = database.begin().expect("child transaction");
                  let mut parent = database.begin().expect("parent transaction");
                  child
                      .insert(&database, CHILDREN, row(CHILDREN, 12, Some(1)))
                      .expect("stage child");
                  parent
                      .delete(&database, PARENTS, key_of(PARENTS, 1))
                      .expect("stage parent delete");

                  child.commit().expect("child commits");
                  let parent_result = parent.commit();
                  let parent_present = database
                      .get(PARENTS, key_of(PARENTS, 1))
                      .expect("parent read")
                      .is_some();
                  let child_present = database
                      .get(CHILDREN, key_of(CHILDREN, 12))
                      .expect("child read")
                      .is_some();
                  eprintln!(
                      "child-first: parent_result={parent_result:?}, parent_present={parent_present}, child_present={child_present}"
                  );
                  assert!(parent_result.is_err(), "overlapping parent delete unexpectedly committed");
                  assert!(parent_present, "failed parent delete became durable");
                  assert!(child_present, "committed child disappeared");
              }

              // Parent publishes first. The overlapping child insert must fail,
              // and the durable state must contain neither parent nor child.
              {
                  let (_directory, database) = database_with_parent_and_restrict_fk();
                  let mut child = database.begin().expect("child transaction");
                  let mut parent = database.begin().expect("parent transaction");
                  child
                      .insert(&database, CHILDREN, row(CHILDREN, 12, Some(1)))
                      .expect("stage child");
                  parent
                      .delete(&database, PARENTS, key_of(PARENTS, 1))
                      .expect("stage parent delete");

                  parent.commit().expect("parent commits");
                  let child_result = child.commit();
                  let parent_present = database
                      .get(PARENTS, key_of(PARENTS, 1))
                      .expect("parent read")
                      .is_some();
                  let child_present = database
                      .get(CHILDREN, key_of(CHILDREN, 12))
                      .expect("child read")
                      .is_some();
                  eprintln!(
                      "parent-first: child_result={child_result:?}, parent_present={parent_present}, child_present={child_present}"
                  );
                  assert!(child_result.is_err(), "overlapping child insert unexpectedly committed");
                  assert!(!parent_present, "committed parent delete disappeared");
                  assert!(!child_present, "failed child insert became durable");
              }
          }
          RS
          cargo fmt --all
      - name: Run focused FK race diagnostic
        run: cargo test --locked --test project_referential_actions overlapping_parent_delete_and_child_insert_cannot_both_commit -- --nocapture
