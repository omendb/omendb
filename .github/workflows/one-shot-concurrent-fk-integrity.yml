name: One-shot concurrent FK integrity

on:
  push:
    branches:
      - test/concurrent-fk-integrity

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt, clippy
      - name: Apply FK range-dependency repair and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/seer_direct.rs')
          text = path.read_text()

          impl_start = text.index('impl DirectTransaction {')
          index_start = text.index(
              '    fn index_tree(&self, index: IndexId) -> Result<TreeId> {',
              impl_start,
          )
          read_marker = "\n    /// Read one row at this transaction's snapshot."
          index_end = text.index(read_marker, index_start)
          helper = '''

          /// Scan an entire tree while registering the range as a read dependency.
          ///
          /// Referential-integrity validation uses this instead of snapshot-only
          /// `scan` so a concurrent write cannot invalidate the checked state before
          /// publication.
          fn scan_with_range_dependency(
              &mut self,
              tree: TreeId,
          ) -> Result<Vec<(Vec<u8>, Vec<u8>)>> {
              let cursor = self
                  .transaction
                  .cursor(tree, &[], None)
                  .map_err(map_seer_error)?;
              let mut entries = Vec::new();
              for entry in cursor {
                  entries.push(entry.map_err(map_seer_error)?);
              }
              Ok(entries)
          }
          '''
          text = text[:index_end] + helper + text[index_end:]

          start_marker = '    fn validate_referential_integrity(&self) -> Result<()> {'
          tail_marker = '\n}\nfn validate_mapping'
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected one validation function, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(tail_marker, start)
          replacement = '''    fn validate_referential_integrity(&mut self) -> Result<()> {
              if self.catalog.foreign_keys().next().is_none() {
                  return Ok(());
              }
              let foreign_keys: Vec<ForeignKeyDefinition> =
                  self.catalog.foreign_keys().cloned().collect();
              for foreign_key in foreign_keys {
                  let child_definition = self.catalog.table(foreign_key.table)?.clone();
                  let referenced_definition =
                      self.catalog.table(foreign_key.referenced_table)?.clone();
                  let referenced_index = self
                      .catalog
                      .indexes_for(foreign_key.referenced_table)
                      .find(|index| {
                          index.unique && index.columns == foreign_key.referenced_columns
                      })
                      .cloned()
                      .ok_or_else(|| {
                          DbError::InvalidState(format!(
                              "foreign key {} has no unique referenced index",
                              foreign_key.id.0
                          ))
                      })?;

                  // The current alpha validator already examines the complete child
                  // table and referenced unique index. Register those same ranges so
                  // a concurrent write cannot invalidate the successful check before
                  // this transaction publishes.
                  let referenced_tree = self.index_tree(referenced_index.id)?;
                  let referenced_values: std::collections::HashSet<Vec<u8>> = self
                      .scan_with_range_dependency(referenced_tree)?
                      .into_iter()
                      .filter_map(|(entry, existing_identity)| {
                          decode_index_entry(&entry, &existing_identity)
                              .ok()
                              .map(|(values, _)| values)
                      })
                      .collect();
                  let child_tree = self.table_tree(foreign_key.table)?;
                  let child_rows = self.scan_with_range_dependency(child_tree)?;
                  for (identity_bytes, bytes) in child_rows {
                      let row = row_from_storage_identity(
                          &self.catalog,
                          &child_definition,
                          &identity_bytes,
                          &bytes,
                      )?;
                      let values = foreign_key_values(
                          &row,
                          &child_definition,
                          &foreign_key.columns,
                      )?;
                      if values.iter().any(|value| matches!(value, Value::Null)) {
                          continue;
                      }
                      let encoded = index_values_key(
                          &referenced_definition,
                          &referenced_index,
                          &values,
                      )?;
                      if !referenced_values.contains(&encoded) {
                          return Err(DbError::ForeignKeyViolation {
                              constraint: foreign_key.id.0,
                              table: foreign_key.table.0,
                              referenced_table: foreign_key.referenced_table.0,
                          });
                      }
                  }
              }
              Ok(())
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          cat >> tests/project_referential_actions.rs <<'RS'

          #[test]
          fn overlapping_parent_delete_and_child_insert_cannot_both_commit() {
              fn database_with_parent_and_restrict_fk() -> (tempfile::TempDir, RelationalDatabase) {
                  let (directory, mut database) = setup();
                  database
                      .insert(PARENTS, row(PARENTS, 1, Some(0)))
                      .expect("parent");
                  database
                      .create_foreign_key(fk(
                          1,
                          CHILDREN,
                          PARENTS,
                          omendb::ReferentialAction::Restrict,
                      ))
                      .expect("restrict fk");
                  (directory, database)
              }

              // Child publishes first. Parent deletion validated an older child
              // snapshot, so the child-table range dependency must reject it.
              {
                  let (_directory, database) = database_with_parent_and_restrict_fk();
                  let mut child = database.begin().expect("child transaction");
                  let mut parent = database.begin().expect("parent transaction");
                  child
                      .insert(&database, CHILDREN, row(CHILDREN, 12, Some(1)))
                      .expect("stage child");
                  parent
                      .delete(&database, PARENTS, key_of(PARENTS, 1))
                      .expect("stage parent delete");

                  child.commit().expect("child commits");
                  assert!(matches!(
                      parent.commit(),
                      Err(omendb::DbError::SerializationConflict { .. })
                  ));
                  assert!(
                      database
                          .get(PARENTS, key_of(PARENTS, 1))
                          .expect("parent read")
                          .is_some()
                  );
                  assert!(
                      database
                          .get(CHILDREN, key_of(CHILDREN, 12))
                          .expect("child read")
                          .is_some()
                  );
              }

              // Parent publishes first. Child insertion validated an older
              // referenced-index snapshot, so that range dependency must reject it.
              {
                  let (_directory, database) = database_with_parent_and_restrict_fk();
                  let mut child = database.begin().expect("child transaction");
                  let mut parent = database.begin().expect("parent transaction");
                  child
                      .insert(&database, CHILDREN, row(CHILDREN, 12, Some(1)))
                      .expect("stage child");
                  parent
                      .delete(&database, PARENTS, key_of(PARENTS, 1))
                      .expect("stage parent delete");

                  parent.commit().expect("parent commits");
                  assert!(matches!(
                      child.commit(),
                      Err(omendb::DbError::SerializationConflict { .. })
                  ));
                  assert!(
                      database
                          .get(PARENTS, key_of(PARENTS, 1))
                          .expect("parent read")
                          .is_none()
                  );
                  assert!(
                      database
                          .get(CHILDREN, key_of(CHILDREN, 12))
                          .expect("child read")
                          .is_none()
                  );
              }
          }
          RS
          cargo fmt --all
      - name: Verify focused FK race repeatedly
        run: |
          for attempt in 1 2 3 4 5; do
            echo "FK race qualification run ${attempt}"
            cargo test --locked --test project_referential_actions overlapping_parent_delete_and_child_insert_cannot_both_commit -- --nocapture
          done
      - name: Verify referential-action suite
        run: cargo test --locked --test project_referential_actions
      - name: Verify strict Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-concurrent-fk-integrity.yml
          git add src/seer_direct.rs tests/project_referential_actions.rs
          git commit -m 'fix: protect concurrent foreign-key validation'
          git push origin HEAD:${GITHUB_REF_NAME}
