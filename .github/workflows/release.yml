name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and verify only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # For creating GitHub releases
  checks: write # For rustsec/audit-check to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_NIGHTLY: nightly-2024-12-01

jobs:
  # ==========================================================================
  # Stage 1: Verification (same as CI, must all pass)
  # ==========================================================================

  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Extract version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --no-default-features --lib -- \
            -D warnings \
            -D clippy::correctness

      - name: Build docs
        run: cargo doc --workspace --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Unit tests
        run: cargo test --lib --no-default-features
        timeout-minutes: 10

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check semver
        run: cargo semver-checks check-release
        continue-on-error: true # Warn but don't block (new crate)

  # ==========================================================================
  # Stage 2: Build release artifacts
  # ==========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify, security, deny]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --no-default-features

      - name: Package crate
        run: cargo package --no-verify

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate

  # ==========================================================================
  # Stage 3: Publish to crates.io (OIDC trusted publishing)
  # ==========================================================================

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build, semver]
    if: ${{ !inputs.dry-run }}
    permissions:
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish to crates.io
        run: cargo publish --token ${{ steps.crates-io-auth.outputs.token }}

  # ==========================================================================
  # Stage 4: Create GitHub release
  # ==========================================================================

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, verify]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for changelog

      - uses: actions/download-artifact@v4
        with:
          name: crate-package
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          # Write to file for multiline handling
          cat << 'EOF' > changelog.md
          ## What's Changed

          $COMMITS

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ needs.verify.outputs.version }}
          EOF

          echo "Generated changelog for v${{ needs.verify.outputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          body_path: changelog.md
          files: artifacts/*.crate
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
