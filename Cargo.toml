[package]
name = "seerdb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["seerdb contributors"]
description = "High-performance out-of-place B-tree storage engine for NVMe SSDs"
repository = "https://github.com/omendb/seerdb"
readme = "README.md"
keywords = ["database", "btree", "storage", "nvme", "embedded"]
categories = ["database-implementations", "data-structures"]

[dependencies]
thiserror = "2.0"
crc32c = "0.6"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
tempfile = "3.14"
rand = "0.8"
serde_json = "1.0.150"

[[bench]]
name = "seerdb"
harness = false

[[bench]]
name = "ycsb"
harness = false

[features]
default = []
# ZNS SSD support (Linux only)
zns = []
# FDP placement hints (Linux only)
fdp = []
# io_uring async I/O (Linux only)
io-uring = []
# Deterministic device failures for recovery and publication tests.
fault-injection = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
