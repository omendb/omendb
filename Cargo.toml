[package]
name = "omendb"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
description = "Embedded relational database built around SeerDB"
license = "AGPL-3.0-only"
repository = "https://github.com/omendb/omendb"
readme = "README.md"

[features]
default = []
seerdb-fault-injection = ["seerdb/fault-injection"]
pgwire = ["dep:pgwire", "dep:tokio", "dep:async-trait", "dep:futures"]
async-trait = ["dep:async-trait"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
futures = { version = "0.3", optional = true }
crc32c = "0.6.8"
fs2 = "0.4.3"
libc = "0.2.186"
pgwire = { version = "0.40.7", optional = true }
seerdb = { git = "https://github.com/omendb/seerdb", rev = "b65a8feb2d0748abf058acc36f47c325bf9656b2" }
sha2 = "0.11.0"
sqlparser = { version = "0.62.0", default-features = false, features = ["recursive-protection", "std", "visitor"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "time", "io-util", "sync"], optional = true }

[[example]]
name = "concurrency_stress"
required-features = ["pgwire"]

[[example]]
name = "pgwire_serve"
required-features = ["pgwire"]

[dev-dependencies]
bytes = "1"
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio-postgres = "0.7.18"
rusqlite = { version = "0.40.2", features = ["bundled"] }
